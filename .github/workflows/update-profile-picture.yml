# .github/workflows/update-profile-picture.yml

name: runWorkflow (Test3)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runWorkflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run profile picture update
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_TOTP_SECRET: ${{ secrets.GH_TOTP_SECRET }}
          PINTEREST_SOURCE_BOARD: ${{ vars.PINTEREST_SOURCE_BOARD }}
          PROFILE_PICTURE_DIR: ${{ vars.PROFILE_PICTURE_DIR }}
        run: python src/main.py