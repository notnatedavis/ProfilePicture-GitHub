# .github/workflows/update-profile-picture.yml

name: Update GitHub Profile Picture (Test1)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update profile picture
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PINTEREST_SOURCE_BOARD: ${{ secrets.PINTEREST_SOURCE_BOARD }}
        run: python src/main.py